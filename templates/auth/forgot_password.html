{% extends "base.html" %}
{% block title %}Forgot password — {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Forgot password</h1>
    <p class="text-muted">Enter your email and we'll send a reset link.</p>
    <form method="post" action="/forgot-password" class="ss-form">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Send reset link</button>
    </form>
    <p class="mt-3 small"><a href="/login">Back to login</a></p>
  </div>
</div>
{% endblock %}
