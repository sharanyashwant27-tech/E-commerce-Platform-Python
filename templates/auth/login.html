{% extends "base.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Sign in</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="ss-form">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <p class="mt-3 small"><a href="/forgot-password">Forgot password?</a> · No account? <a href="/register">Register</a></p>
    <div class="alert alert-light border small mt-3">
      Demo: <code>admin@shopsphere.local</code> / <code>Admin@12345</code>
    </div>
  </div>
</div>
{% endblock %}
